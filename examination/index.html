<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="ICEFOCUS · Learning Course 课程中心（自动发现课程）">
<title>Learning Course · ICEFOCUS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b1020'/><text x='16' y='22' font-size='16' font-family='sans-serif' font-weight='700' fill='%2338bdf8' text-anchor='middle'>IF</text></svg>">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0b1020; --ink:#e8eefb; --dim:#8b9ec2; --dim2:#5c6d8f;
  --a1:#38bdf8; --a2:#a78bfa; --a3:#34d399;
  --line:rgba(140,170,220,.16); --card:rgba(19,26,46,.66);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column;
}
.glow{
  position:fixed; inset:-20% -10%; z-index:0; pointer-events:none;
  background:
    radial-gradient(38% 42% at 18% 22%, rgba(56,189,248,.18), transparent 62%),
    radial-gradient(34% 38% at 82% 26%, rgba(167,139,250,.18), transparent 62%),
    radial-gradient(46% 44% at 50% 96%, rgba(52,211,153,.10), transparent 66%);
  filter:blur(20px);
}
.wrap{position:relative; z-index:1; width:100%; max-width:1180px; margin:0 auto; padding:0 18px 60px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky; top:0; z-index:10;
  padding:10px 18px calc(10px); display:flex; align-items:center; gap:10px;
  background:rgba(11,16,32,.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); padding-top:calc(10px + max(env(safe-area-inset-top,0px),16px));  /* 手机端让出刘海/摄像头高度，按钮不再压边 */
}
.logo{font-size:15px; font-weight:800; letter-spacing:.16em; color:var(--ink)}
.logo span{color:var(--a1)}
header .sp{flex:1}
.home{
  display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  color:var(--dim); font-size:12.5px; border:1px solid var(--line);
  padding:5px 11px; border-radius:999px; transition:.18s; white-space:nowrap;
}
.home:hover{color:var(--ink); border-color:rgba(140,170,220,.4)}

/* ---------- Hero ---------- */
.hero{padding:40px 4px 22px; text-align:center}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.22em;
  color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:5px 13px;
}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--a1);box-shadow:0 0 8px var(--a1)}
.hero h1{
  margin:16px 0 8px; font-size:clamp(30px,7vw,46px); letter-spacing:.04em; font-weight:800;
  background:linear-gradient(100deg,#e8eefb 10%,var(--a1) 50%,var(--a2) 90%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{margin:0; color:var(--dim); font-size:13.5px; letter-spacing:.06em}
.hero .statline{margin-top:14px; color:var(--dim2); font-size:12.5px; letter-spacing:.08em}
.hero .statline b{color:var(--a1); font-weight:700}

/* ---------- 同步状态条 ---------- */
.syncbar{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  margin:20px auto 0; padding:9px 14px; font-size:12.5px; color:var(--dim);
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  max-width:780px; line-height:1.7;
}
.syncbar .dot{width:7px;height:7px;border-radius:50%;background:#64748b;flex:0 0 auto}
.syncbar .dot.on{background:var(--a3); box-shadow:0 0 8px var(--a3)}
.syncbar .dot.warn{background:#f59e0b; box-shadow:0 0 8px #f59e0b}
.syncbar b{color:var(--ink); font-weight:600}
.syncbar .sp{flex:1}
.syncbar a{color:var(--a1); text-decoration:none; border-bottom:1px dashed rgba(56,189,248,.4)}
.syncbar a:hover{border-bottom-style:solid}

/* ---------- 工具行 ---------- */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:26px 2px 0}
.search{flex:1 1 260px; position:relative}
.search input{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:11px;
  color:var(--ink); font:inherit; font-size:13.5px; padding:10px 14px 10px 36px; outline:none;
  transition:border-color .18s;
}
.search input::placeholder{color:var(--dim2)}
.search input:focus{border-color:rgba(56,189,248,.5)}
.search::before{content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-52%); color:var(--dim2); font-size:17px}
.fbtn{
  background:var(--card); border:1px solid var(--line); color:var(--dim); cursor:pointer;
  font:inherit; font-size:12.5px; padding:9px 14px; border-radius:11px; transition:.18s;
}
.fbtn:hover{color:var(--ink); border-color:rgba(140,170,220,.4)}
.fbtn.on{color:#6ee7b7; border-color:rgba(52,211,153,.45); background:rgba(52,211,153,.10)}

/* ---------- 课程卡 ---------- */
.secTitle{
  margin:34px 2px 14px; display:flex; align-items:baseline; gap:10px;
  font-size:12px; letter-spacing:.2em; color:var(--dim2);
}
.secTitle::after{content:""; flex:1; height:1px; background:var(--line)}
.secTitle .cnt{letter-spacing:0; color:var(--dim); font-size:12.5px; white-space:nowrap}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
@media (max-width:520px){ .grid{grid-template-columns:1fr} }

.course{
  position:relative; display:flex; flex-direction:column; gap:12px;
  padding:20px; border-radius:18px; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--line); overflow:hidden;
  transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease;
}
.course::before{
  content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background:var(--cg,radial-gradient(120% 90% at 12% 6%, rgba(56,189,248,.16), transparent 62%));
  transition:opacity .25s;
}
.course:hover{transform:translateY(-4px); border-color:rgba(140,170,220,.36);
  box-shadow:0 18px 44px -20px rgba(0,0,0,.85)}
.course:hover::before{opacity:.85}
.course.todo{cursor:pointer; opacity:.66}
.course.todo:hover{transform:none; box-shadow:none; border-color:var(--line)}
.course.blank{border-style:dashed; opacity:.5}
.course > *{position:relative}

.chead{display:flex; align-items:flex-start; gap:12px}
.cico{
  width:44px; height:44px; flex:0 0 44px; border-radius:13px; display:grid; place-items:center;
  background:rgba(140,170,220,.10); border:1px solid var(--line); font-size:20px;
}
.ctitle{min-width:0; flex:1}
.ctitle h3{margin:0; font-size:17px; font-weight:700; letter-spacing:.02em; word-break:break-word}
.ctitle .en{display:block; margin-top:3px; font-size:11.5px; color:var(--dim); letter-spacing:.14em; text-transform:uppercase; word-break:break-word}
.badge{
  flex:0 0 auto; font-size:10.5px; letter-spacing:.08em; padding:3px 9px; border-radius:999px;
  border:1px solid var(--line); color:var(--dim);
}
.badge.live{color:#6ee7b7; border-color:rgba(52,211,153,.42); background:rgba(52,211,153,.10)}
.badge.soon{color:#fcd34d; border-color:rgba(245,158,11,.38); background:rgba(245,158,11,.10)}
.badge.blank{color:var(--dim2); border-color:var(--line); background:rgba(140,170,220,.06)}

.code{
  display:inline-block; font-size:10.5px; letter-spacing:.14em; color:var(--dim2);
  border:1px solid var(--line); border-radius:6px; padding:2px 7px;
}
.desc{margin:0; font-size:13px; line-height:1.85; color:var(--dim)}
.mods{display:flex; flex-wrap:wrap; gap:7px}
.mod{
  font-size:11.5px; color:var(--dim); border:1px solid var(--line); border-radius:999px;
  padding:3px 10px; background:rgba(140,170,220,.06);
}
.meter{height:3px; border-radius:3px; background:rgba(140,170,220,.14); overflow:hidden}
.meter i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--a1),var(--a2)); transition:width .6s ease}
.foot2{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim2)}
.foot2 .sp{flex:1}
.enter{font-size:12.5px; color:var(--a1); letter-spacing:.06em; white-space:nowrap}
.course.todo .enter{color:var(--dim2)}
.dirtag{font-size:10.5px; color:var(--dim2); font-family:ui-monospace,Consolas,monospace; word-break:break-all}

.empty{color:var(--dim2); font-size:13.5px; padding:30px 4px; text-align:center; grid-column:1/-1}

/* ---------- 页脚 ---------- */
footer{position:relative; z-index:1; text-align:center; padding:26px 16px 34px;
  color:var(--dim2); font-size:11.5px; letter-spacing:.1em; border-top:1px solid var(--line);
  padding-bottom:calc(34px + env(safe-area-inset-bottom))}
footer a{color:var(--dim); text-decoration:none; border-bottom:1px dashed rgba(140,170,220,.3)}
footer a:hover{color:var(--a1)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="glow"></div>

<header>
  <span class="logo">IF<span>.</span></span>
  <span class="sp"></span>
  <a class="home" href="../links">短链导航</a>
  <a class="home" href="../index.html">&larr; 首页</a>
</header>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow"><i></i>LEARNING COURSE</div>
    <h1>课程中心</h1>
    <p>网页 · 手机 · APK 三端通用，学习进度自动同步到 GitHub</p>
    <div class="statline" id="statline">正在扫描课程…</div>
  </section>

  <div class="syncbar" id="syncbar">
    <span class="dot" id="syncDot"></span>
    <span id="syncTxt">正在读取同步状态…</span>
    <span class="sp"></span>
    <span id="syncTime"></span>
  </div>

  <div class="toolbar">
    <div class="search"><input id="kw" type="search" placeholder="搜索课程名 / 课程代码 / 目录名，例如：西方经济学、13135、00076"></div>
    <button class="fbtn on" id="fAll">全部</button>
    <button class="fbtn" id="fLive">已上线</button>
    <button class="fbtn" id="fBlank">课程位</button>
    <button class="fbtn" id="fScan" title="重新扫描 examination/ 下的课程目录">↻ 重新扫描</button>
  </div>

  <div class="secTitle">COURSES · 已上线 <span class="cnt" id="cntLive"></span></div>
  <div class="grid" id="gridLive"></div>

  <div class="secTitle">UPCOMING · 课程位 <span class="cnt" id="cntTodo"></span></div>
  <div class="grid" id="gridTodo"></div>
</div>

<footer>© 2026 ICEFOCUS · Learning Course · <a href="../index.html">返回首页</a></footer>

<script>
/* =========================================================================
 *  课程中心 · 自动发现版
 *  ─────────────────────────────────────────────────────────────────────
 *  加一门课 = 在 examination/ 下建一个目录，放一个 course.json（写名字等元数据），
 *  再把 outline.html / bank.html 丢进去。**不需要改这个文件。**
 *
 *  名称识别顺序：<dir>/course.json 的 cn → 目录名
 *  目录发现顺序：courses.json 的 fallback（秒出、离线可用）
 *              → GitHub API 扫 examination/（自动补发现新目录，结果缓存 1 小时）
 * ======================================================================= */
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var CFG = { slots: 12, autoDiscover: true, fallback: [], owner: 'icefocus-G',
              repo: 'icefocus-G.github.io', branch: 'main', showReserved: true,
              reserved: ['shell', 'template', 'tools', 'assets', 'data', 'script'] };
  var COURSES = [];
  var filter = 'all', kw = '';

  /* ---------------- 1) 读配置 ---------------- */
  function loadConfig() {
    return fetch('courses.json?t=' + Date.now(), { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (o) {
        Object.keys(CFG).forEach(function (k) {
          if (o[k] !== undefined && String(k).charAt(0) !== '_') CFG[k] = o[k];
        });
        return CFG;
      })
      .catch(function () { return CFG; });
  }

  /* ---------------- 2) 目录发现（GitHub API，缓存 1 小时） ---------------- */
  var K_DISC = 'IF::courseDirs';
  function apiDiscover() {
    if (!CFG.autoDiscover) return Promise.resolve([]);
    try {
      var o = JSON.parse(localStorage.getItem(K_DISC) || 'null');
      if (o && o.at && Date.now() - o.at < 3600000 && Array.isArray(o.dirs)) return Promise.resolve(o.dirs);
    } catch (e) {}
    var url = 'https://api.github.com/repos/' + CFG.owner + '/' + CFG.repo +
              '/contents/examination?ref=' + encodeURIComponent(CFG.branch);
    return fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (arr) {
        if (!Array.isArray(arr)) return [];
        var dirs = arr.filter(function (e) {
          return e && e.type === 'dir' && e.name && e.name.charAt(0) !== '_' && e.name.charAt(0) !== '.'
                 && CFG.reserved.indexOf(e.name) < 0;
        }).map(function (e) { return e.name; });
        try { localStorage.setItem(K_DISC, JSON.stringify({ at: Date.now(), dirs: dirs })); } catch (e) {}
        return dirs;
      })
      .catch(function () { return []; });
  }

  /* ---------------- 3) 读每个课程的 course.json ---------------- */
  function fetchCourse(dir) {
    var isBlank = /^course[-_ ]?\d+$/i.test(dir);
    return fetch(encodeURI(dir) + '/course.json?t=' + Date.now(), { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (c) {
        c.dir = dir;
        if (!c.cn) c.cn = dir;                        // 名字兜底＝目录名
        if (!c.entry) c.entry = 'study.html';
        if (!c.status) c.status = 'live';
        return c;
      })
      .catch(function () {
        /* 没有 course.json：目录名直接当课程名，交给通用壳自己兜底 */
        return {
          dir: dir, cn: dir, en: '', code: '',
          ico: isBlank ? '➕' : '📚',
          status: isBlank ? 'reserved' : 'live',
          entry: '/shell/study.html?course=' + encodeURIComponent(dir),
          desc: isBlank ? '预留课程位。' : '未提供 course.json，按目录名显示。'
        };
      });
  }

  /* ---------------- 4) 学习进度（按 localStorage 前缀统计） ---------------- */
  function judgedOf(c) {
    if (!c.storage) return { done: 0, pct: 0 };
    var done = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(c.storage) !== 0) continue;
        if (k.indexOf('hist_') > 0) done++;
      }
    } catch (e) { return { done: 0, pct: 0 }; }
    var pct = c.total ? Math.min(100, Math.round(done / c.total * 100)) : 0;
    return { done: done, pct: pct };
  }

  /* ---------------- 5) 运行环境 ----------------
     只用于「显示判断」（APK 里隐藏返回首页入口），
     ★ 绝不再用来改写链接路径。 */
  function isAPK() {
    try {
      if (window.__IF_APK__ === true || window.__IF_NATIVE__ === true) return true;
      if (/[?&]apk=1/.test(location.search)) return true;
      /* 只认壳层写入的新标记 IF::inApp。
         旧键 IF::apk 是历史遗留 —— 以前的 study.html 一进课程就会写它，
         结果回到课程中心时被当成「内嵌 APK」，把目录名里的空格删掉导致 404。
         这里不再读旧键，从根上掐断。 */
      return localStorage.getItem('IF::inApp') === '1';
    } catch (e) { return false; }
  }

  /* ---------------- 6) 渲染 ----------------
     entry 约定：
       以 "/" 开头        → 相对 examination/（去掉开头的斜杠）
       以 "./" "../" 开头 → 相对当前页，原样使用
       其它               → 相对课程目录
     没有 entry 时自动落到通用壳 shell/study.html?course=<目录>（壳自己会兜底）

     ★ 目录名一律按 course.json / 目录列表里的**原名**用，包括空格。
       老版本内嵌 APK 曾把 "Western Economics" 去空格成 "WesternEconomics"，
       套壳版访问的是 GitHub 上的原名目录，所以这里不能再去空格 —— 一去就 404。 */
  function hrefOf(c) {
    var e = c.entry;
    if (e) {
      if (e.charAt(0) === '/') return e.slice(1);
      if (/^\.\.?\//.test(e)) return e;
      return encodeURIComponent(c.dir) + '/' + e;
    }
    return 'shell/study.html?course=' + encodeURIComponent(c.dir);
  }

  function cardHTML(c) {
    var live = c.status === 'live';
    var reserved = c.status === 'reserved';
    /* 有题库（storage + total）才统计判分进度；纯阅读型课件（如 Unity）不显示
       「已判分 0 题 · 0%」这种会让人以为内容空着的假进度。 */
    var hasBank = !!(c.total && c.storage);
    var pg = hasBank ? judgedOf(c) : { done: 0, pct: 0 };
    var badge = live ? '<span class="badge live">已上线</span>'
                     : (reserved ? '<span class="badge blank">空位</span>'
                                 : '<span class="badge soon">建设中</span>');
    var cg = c.theme ? 'style="--cg:radial-gradient(120% 90% at 12% 6%,' + esc(c.theme) + '33,transparent 62%)"' : '';
    var foot = live
      ? (hasBank ? ('已判分 ' + pg.done + ' 题 · ' + pg.pct + '%')
                 : esc(c.note || '阅读型课程 · 无判分'))
      : (reserved ? '待启用' : '内容筹备中');
    return '<a class="course' + (live ? '' : ' todo') + (reserved ? ' blank' : '') + '"' +
      ' href="' + esc(hrefOf(c)) + '" ' + cg +
      ' aria-label="' + esc(c.cn) + '" data-dir="' + esc(c.dir) + '">' +
        '<div class="chead">' +
          '<div class="cico">' + esc(c.ico || (reserved ? '➕' : '📚')) + '</div>' +
          '<div class="ctitle">' +
            '<h3>' + esc(c.cn) + (c.code ? ' <span class="code">' + esc(c.code) + '</span>' : '') + '</h3>' +
            '<span class="en">' + esc(c.en || c.dir) + '</span>' +
          '</div>' + badge +
        '</div>' +
        (c.desc ? '<p class="desc">' + esc(c.desc) + '</p>' : '') +
        (c.mods && c.mods.length
          ? '<div class="mods">' + c.mods.map(function (m) { return '<span class="mod">' + esc(m) + '</span>'; }).join('') + '</div>'
          : '') +
        (live && hasBank ? '<div class="meter"><i style="width:' + pg.pct + '%"></i></div>' : '') +
        '<div class="foot2">' +
          '<span>' + foot + '</span>' +
          '<span class="sp"></span>' +
          '<span class="enter">' + (live ? '进入学习 →' : '查看占位页 →') + '</span>' +
        '</div>' +
        '<div class="dirtag">' + esc(c.dir) + '</div>' +
      '</a>';
  }

  function match(c) {
    if (filter === 'live' && c.status !== 'live') return false;
    if (filter === 'blank' && c.status === 'live') return false;
    if (kw) {
      var hay = (c.cn + ' ' + (c.en || '') + ' ' + (c.code || '') + ' ' + (c.dir || '') + ' ' + (c.desc || '')).toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  }

  function render() {
    var list = COURSES.filter(match);
    var live = list.filter(function (c) { return c.status === 'live'; });
    var todo = list.filter(function (c) { return c.status !== 'live'; });

    $('#gridLive').innerHTML = live.length ? live.map(cardHTML).join('')
      : '<div class="empty">' + ((kw || filter !== 'all') ? '没有匹配的已上线课程' : '还没有已上线的课程') + '</div>';
    $('#gridTodo').innerHTML = todo.length ? todo.map(cardHTML).join('')
      : '<div class="empty">暂无课程位 —— 在 examination/ 下建目录、放 course.json 就会自动出现</div>';

    $('#cntLive').textContent = '共 ' + live.length + ' 门';
    $('#cntTodo').textContent = '共 ' + todo.length + ' 个';
  }

  function renderStats() {
    var live = COURSES.filter(function (c) { return c.status === 'live'; }).length;
    var all = COURSES.length;
    $('#statline').innerHTML =
      '共 <b>' + all + '</b> 个课程位 · 已上线 <b>' + live + '</b> · 建设中 <b>' + (all - live) + '</b>' +
      (CFG.slots > all ? ' · 还可再放 <b>' + (CFG.slots - all) + '</b> 门' : '');
  }

  /* 发现的课程少于 slots 时，补出「空白课程位」卡片，保证页面始终有足够坑位 */
  function padSlots(list) {
    if (!CFG.showReserved || !(CFG.slots > 0) || list.length >= CFG.slots) return list;
    var used = {}, maxNo = 0;
    list.forEach(function (c) {
      used[c.dir] = 1;
      var m = /^course[-_ ]?(\d+)$/i.exec(c.dir);
      if (m) maxNo = Math.max(maxNo, parseInt(m[1], 10));
    });
    var need = Math.min(CFG.slots - list.length, 20);
    for (var i = 1; i <= need; i++) {
      var no = String(maxNo + i); if (no.length < 2) no = '0' + no;
      var dir = 'Course-' + no, k = 0;
      while (used[dir]) { k++; dir = 'Course-' + no + '-' + k; }
      used[dir] = 1;
      var cn = '空白课程位 ' + no;
      list.push({
        dir: dir, cn: cn, en: 'Reserved Slot ' + no, ico: '➕', code: '', status: 'reserved',
        entry: '/shell/study.html?stub=1&name=' + encodeURIComponent(cn),
        desc: '预留课程位。把内容放进 examination/' + dir + '/ 就会自动变成一门正式课程。'
      });
    }
    return list;
  }

  function sortCourses(list) {
    return list.sort(function (a, b) {
      var oa = a.order == null ? 900 : a.order, ob = b.order == null ? 900 : b.order;
      if (oa !== ob) return oa - ob;
      return String(a.dir).localeCompare(String(b.dir));
    });
  }

  function load(dirs) {
    var seen = {};
    dirs = dirs.filter(function (d) {
      if (!d || seen[d]) return false;
      if (String(d).charAt(0) === '_' || String(d).charAt(0) === '.') return false;   // 系统目录
      if ((CFG.reserved || []).indexOf(d) >= 0) return false;                        // 保留名
      seen[d] = 1; return true;
    });
    return Promise.all(dirs.map(fetchCourse)).then(function (list) {
      COURSES = padSlots(sortCourses(list));
      renderStats(); render();
    });
  }

  function boot() {
    $('#statline').textContent = '正在扫描课程…';
    loadConfig().then(function () {
      var base = (CFG.fallback || []).slice();
      if (base.length) load(base);                      // 秒出，离线也能用
      apiDiscover().then(function (found) {
        var all = base.concat(found || []);
        if (all.length) load(all);                      // 再补上自动发现的新目录
      });
    });
  }

  /* 筛选与搜索 */
  function setFilter(f) {
    filter = f;
    [['fAll', 'all'], ['fLive', 'live'], ['fBlank', 'blank']].forEach(function (p) {
      $('#' + p[0]).classList.toggle('on', p[1] === f);
    });
    render();
  }
  $('#fAll').addEventListener('click', function () { setFilter('all'); });
  $('#fLive').addEventListener('click', function () { setFilter('live'); });
  $('#fBlank').addEventListener('click', function () { setFilter('blank'); });
  var tk = null;
  $('#kw').addEventListener('input', function (e) {
    clearTimeout(tk);
    tk = setTimeout(function () { kw = e.target.value.trim().toLowerCase(); render(); }, 160);
  });
  $('#fScan').addEventListener('click', function () {
    var b = this;
    try { localStorage.removeItem(K_DISC); } catch (e) {}
    b.textContent = '扫描中…';
    boot();
    setTimeout(function () { b.textContent = '↻ 重新扫描'; }, 2800);
  });

  /* APK 里没有首页皮肤，隐藏「返回首页」入口 */
  if (isAPK()) {
    var hm = document.querySelector('header a.home');
    if (hm) hm.style.display = 'none';
    var ft = document.querySelector('footer a');
    if (ft) { ft.textContent = 'Learning Course'; ft.removeAttribute('href'); }
    document.querySelector('.hero p').textContent =
      '离线可用 · 答题与判分结果联网后自动同步到 GitHub';
  }

  /* ---------------- 云同步状态条 ---------------- */
  (function () {
    var cfg = null, keys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf('IF::ghcfg::') === 0) keys.push(k);
      }
    } catch (e) {}
    ['IF::ghcfg::IF00076', 'IF76::ghcfg'].forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    for (var j = 0; j < keys.length; j++) {
      try {
        var raw = localStorage.getItem(keys[j]);
        if (raw) { var o = JSON.parse(raw); if (o && o.token) { cfg = o; break; } }
      } catch (e) {}
    }
    var dot = $('#syncDot'), txt = $('#syncTxt'), tm = $('#syncTime');
    var tt = cfg && (cfg.lastPushAt || cfg.lastPullAt);
    if (tt) {
      var d = new Date(tt), p = function (n) { return n < 10 ? '0' + n : '' + n; };
      tm.textContent = '最近同步 ' + (d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                       ' ' + p(d.getHours()) + ':' + p(d.getMinutes()));
    }
    if (cfg && cfg.token) {
      dot.className = 'dot on';
      txt.innerHTML = '云同步<b>已开启</b> · 答题与判分结果会自动同步到 GitHub（' +
        esc(cfg.owner || CFG.owner) + '/' + esc(cfg.repo || CFG.repo) + '）';
    } else {
      dot.className = 'dot warn';
      txt.innerHTML = '本机还没有填写 GitHub Token，学习记录<b>暂时只在本地</b>。' +
        '进入任一课程 → 右上角「☁ 云同步」粘贴一次即可全自动。';
    }
  })();

  boot();
})();
</script>
</body>
</html>
