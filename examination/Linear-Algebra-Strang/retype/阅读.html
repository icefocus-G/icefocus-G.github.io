<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>线性代数 · 重排版阅读</title>
<style>
  :root{--ink:#16202c;--ink2:#4a5766;--ink3:#8b99a8;--line:#e3e9f0;--blue:#1a5cb8;--bg:#f4f7fa}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);overflow:hidden}
  aside{width:216px;flex:0 0 216px;background:#fff;border-right:1px solid var(--line);
    overflow:auto;padding:14px 0 30px}
  aside .hd{padding:0 16px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
  aside .hd b{display:block;font-size:14.5px}
  aside .hd span{font-size:11.5px;color:var(--ink3)}
  .ch{padding:12px 16px 5px;font-size:11.5px;color:var(--blue);font-weight:600;letter-spacing:.03em}
  .ch .cnt{float:right;color:var(--ink3);font-weight:400}
  .it{display:flex;align-items:center;gap:8px;padding:5px 16px;color:var(--ink2);
    text-decoration:none;font-size:13px;border-left:2px solid transparent}
  .it:hover{background:#f2f7fc;color:var(--blue)}
  .it.on{background:#eaf3fc;color:var(--blue);border-left-color:var(--blue);font-weight:600}
  .it .no{font-size:11px;color:var(--ink3);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
  .bar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 11px;
    font:inherit;color:var(--ink2);cursor:pointer}
  .bar button:hover{border-color:var(--blue);color:var(--blue)}
  .bar .sp{margin-left:auto;color:var(--ink3)}
  iframe{flex:1;border:0;width:100%;background:var(--bg)}
</style>
</head>
<body>
<aside>
  <div class="hd"><b>线性代数 · 文字重排版</b><span>Strang 第 6 版 · 共 7 页已重排</span></div>
  <div class="ch">第 1 章 向量和矩阵<span class="cnt">6 页</span></div>
<a class="it" href="p0025.html" target="pg" data-n="25"><span class="no">25</span>印刷第 25 页</a>
<a class="it" href="p0026.html" target="pg" data-n="26"><span class="no">26</span>印刷第 26 页</a>
<a class="it" href="p0027.html" target="pg" data-n="27"><span class="no">27</span>印刷第 27 页</a>
<a class="it" href="p0028.html" target="pg" data-n="28"><span class="no">28</span>印刷第 28 页</a>
<a class="it" href="p0029.html" target="pg" data-n="29"><span class="no">29</span>印刷第 29 页</a>
<a class="it" href="p0030.html" target="pg" data-n="30"><span class="no">30</span>印刷第 30 页</a>
<div class="ch">第 2 章 解线性方程<span class="cnt">1 页</span></div>
<a class="it" href="p0070.html" target="pg" data-n="70"><span class="no">70</span>印刷第 70 页</a>
</aside>
<main>
  <div class="bar">
    <button onclick="go(-1)">← 上一页</button>
    <button onclick="go(1)">下一页 →</button>
    <span id="cur"></span>
    <span class="sp">右侧为纯文字排版页，无扫描图</span>
  </div>
  <iframe name="pg" id="fr" src="p0025.html"></iframe>
</main>
<script>
  var links = Array.prototype.slice.call(document.querySelectorAll('.it'));
  var idx = 0;
  function mark(i){
    links.forEach(function(a){a.classList.remove('on')});
    if(links[i]){links[i].classList.add('on');
      document.getElementById('cur').textContent = '印刷第 ' + links[i].dataset.n + ' 页';
      links[i].scrollIntoView({block:'nearest'});}
  }
  function open(i){
    if(i<0||i>=links.length) return;
    idx=i; location.hash = links[i].getAttribute('href');
    document.getElementById('fr').src = links[i].getAttribute('href');
    mark(i);
  }
  function go(d){open(idx+d)}
  links.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();open(i)})});
  window.addEventListener('load',function(){
    var h=location.hash.replace('#','');
    var i=links.findIndex(function(a){return a.getAttribute('href')===h});
    open(i<0?0:i);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft') go(-1);
    if(e.key==='ArrowRight') go(1);
  });
</script>
</body>
</html>
