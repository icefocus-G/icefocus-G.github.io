<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>练习题 · Unity 小游戏开发实战</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .q { border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; background:#fff; }
  .q h4 { margin:0 0 8px; font-size:14.5px; }
  .q .stem { color:var(--ink2); font-size:14px; margin-bottom:10px; }
  .opts { display:flex; flex-direction:column; gap:6px; }
  .opt {
    text-align:left; font:inherit; font-size:13.5px; cursor:pointer;
    padding:8px 12px; border-radius:8px; border:1px solid var(--line);
    background:#fbfcfe; color:var(--ink2); transition:.15s;
  }
  .opt:hover { border-color:var(--acc); color:var(--acc); }
  .opt.right { background:#e8f8f0; border-color:#9be3c4; color:#0b7a52; }
  .opt.wrong { background:#fdecec; border-color:#f5b5b5; color:#b02020; }
  .exp { margin-top:9px; font-size:13px; color:var(--ink2); background:#f8f9fc; border-left:3px solid var(--acc); border-radius:0 8px 8px 0; padding:9px 12px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .bar .sp { margin-left:auto; font-size:12.5px; color:var(--ink3); }
</style>
</head>
<body>

<header class="ug-top">
  <div class="ug-brand">
    <a href="index.html" style="display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none">
      <span class="ug-logo">U</span><b>Unity 小游戏开发实战</b><i>练习题</i>
    </a>
  </div>
  <div class="ug-top-r">
    <a class="ug-back" href="../index.html">← 课程中心</a>
    <a class="ug-back" href="index.html">☰ 目录</a>
    <a class="ug-back" href="outline.html">▶ 交互课时</a>
  </div>
</header>

<main class="ug-main" style="max-width:1080px;margin:0 auto;padding-top:24px">

  <div class="ug-hero">
    <h1>游戏开发思维 · 练习题</h1>
    <p>这些题不考背 API，考的是「遇到一个需求，你知道该往哪个方向想」。
       建议先玩一遍对应课时上方的可交互演示，再回来做题。</p>
    <div class="stats">
      <span id="qTotal">—</span>
      <span id="qRight">—</span>
      <span id="qRate">—</span>
    </div>
  </div>

  <section class="ug-sec">
    <div class="bar">
      <select id="fChapter" style="font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff">
        <option value="">全部章节</option>
      </select>
      <button class="btn" id="bReset">清空作答记录</button>
      <span class="sp" id="qTip"></span>
    </div>
    <div id="qList"></div>
  </section>

</main>

<script>
/* =============================================================================
 * 练习题：围绕「七步法」与 13 个游戏的真实设计决策
 * ========================================================================== */
(function () {
  'use strict';

  var QS = [
    /* ---------- 通用思维 ---------- */
    { c: '开发思维', q: '拿到一个游戏想法，最应该先做的是什么？',
      o: ['先把美术资源找齐', '用一句话写清「玩家做什么、怎么算赢、怎么算输」', '先搭好 UI 框架', '先选物理引擎'], a: 1,
      e: '规则没定死，后面所有系统都会反复返工。定规则 = 定数据 + 定状态 + 定胜负。' },
    { c: '开发思维', q: '为什么游戏里「移动」通常要放在 FixedUpdate 而不是 Update？',
      o: ['FixedUpdate 更省性能', '渲染帧率会波动，物理步长必须固定才能保证不同机器手感一致', 'Update 不能读输入', '两者其实完全一样'],
      a: 1, e: 'Update 跟渲染帧跑（可能 30/60/144fps），FixedUpdate 跟物理步长跑（默认 0.02s）。把施力放 FixedUpdate，手感才可复现。' },
    { c: '开发思维', q: '「只广播、不决策」的事件模式（如 UnityEvent）主要好处是？',
      o: ['运行更快', '发送方不需要知道谁来处理，两者解耦，便于复用和改动', '可以省掉碰撞体', '能自动存档'], a: 1,
      e: 'Pong 的 ScoringZone 只负责喊「进球了」，加分逻辑交给 GameManager —— 换谁处理都不用改得分区。' },
    { c: '开发思维', q: '把速度拆成「方向 × 速率」两个量管理，主要为了解决什么问题？',
      o: ['让代码更短', '加速/减速只需要改其中一个量，不会互相污染（如反弹时不会意外改变速度大小）', '方便做碰撞', 'Unity 强制要求'],
      a: 1, e: 'Pong 的 Ball.FixedUpdate 正是这么做的：反弹只改方向，速率单独钳制上限。' },

    /* ---------- Pong / Snake ---------- */
    { c: 'Pong · 物理', q: 'Pong 的球拍移动用 AddForce 而不是直接改 position，核心目的是什么？',
      o: ['代码更简洁', '保留物理引擎的碰撞响应与惯性感，手感更自然', 'AddForce 更快', '避免抖动'], a: 1,
      e: '直接改 position 会绕过物理引擎，导致穿模和碰撞失效。' },
    { c: 'Pong · 手感', q: 'Pong 里「动态反弹」的设计意图是？',
      o: ['让球速越来越快', '按击球点偏离拍心的程度改变反弹角，让对拉更有变化', '增加难度', '修复 bug'], a: 1,
      e: '纯水平反弹会让游戏变成无聊的来回。角度变化让玩家能主动控制球路，这才是「手感」。' },
    { c: 'Pong · 架构', q: 'GameManager 用 [DefaultExecutionOrder(-1)] 是为了？',
      o: ['让它最后执行', '确保自己的 Start 先跑，调用 ball / paddle 时它们已 Awake，避免空引用', '提高优先级', '只是习惯'], a: 1,
      e: '脚本间有初始化顺序依赖时，这是最直接的解法。' },
    { c: 'Snake · 网格', q: '贪吃蛇为什么用「固定时间步」推进而不是每帧移动？',
      o: ['更省电', '让移动速度与帧率解耦，同时符合「格子世界」的离散本质', 'Unity 限制', '为了好看'], a: 1,
      e: '格子游戏的世界本来就是离散的，用时间累加器控制步频最自然，也不会因帧率不同而变快变慢。' },
    { c: 'Snake · 输入', q: '蛇为什么要做「输入缓冲」而不是立即响应转向？',
      o: ['为了支持连击', '快速连按时防止在同一格内连续两次转向导致反向自杀', 'Unity 要求', '为了减少计算'], a: 1,
      e: '一个时间步内按了「上」再按「下」，直接响应就变成撞自己。用队列缓存并按顺序校验才安全。' },
    { c: 'Snake · 数据结构', q: '蛇身跟随为什么用「倒序搬运历史位置」而不是每节自己寻路？',
      o: ['寻路太慢', '蛇身本质是「头走过的位置的历史」，倒序搬运天然正确且 O(n)', '节省内存', 'Unity 推荐'], a: 1,
      e: '这是把「需求」翻译成「数据结构」的典型例子：先想清楚本质是什么，代码就很简单。' },

    /* ---------- Flappy / BrickBreaker / DonkeyKong ---------- */
    { c: 'FlappyBird · 物理', q: '像素鸟的跳跃「直接给 velocity.y 赋值」而不是 AddForce，为什么？',
      o: ['更省性能', '保证每次跳跃高度一致、响应即时，手感精准可控', 'AddForce 有 bug', 'Unity 推荐'], a: 1,
      e: '蓄力类手感用 AddForce，精准节拍类用直接赋值。选哪种取决于你想要的手感。' },
    { c: 'FlappyBird · 滚动', q: '「视差滚动」用材质 UV 偏移实现，相比移动 GameObject 的优势是？',
      o: ['更真实', '一张图靠 GPU 采样回绕就能无限滚动，零对象开销、不会穿帮', '支持碰撞', 'Unity 强制'], a: 1,
      e: '这是「用渲染技巧代替对象管理」的典型思路，性能差距很大。' },
    { c: 'BrickBreaker · 数学', q: '打砖块的挡板反弹，为什么用「命中偏移 → 角度 → 旋转方向向量」而不是写 if/else？',
      o: ['if/else 不能用', '用向量运算表达连续变化，角度可平滑调节，代码更通用', '更省内存', 'Unity 限制'], a: 1,
      e: '把「分情况」改成「连续映射」，是游戏手感设计里很关键的思维转变。' },
    { c: 'DonkeyKong · 物理', q: '木桶沿斜面滚动，为什么用刚体 + 重力而不是手写滚动路径？',
      o: ['更简单', '交给物理引擎后，遇到任意坡度/碰撞都能自然响应，不用为每种地形写规则',
             '性能更好', 'Unity 要求'], a: 1,
      e: '能用物理解决的就别手写规则 —— 这是 13 个游戏反复出现的取舍。' },
    { c: 'DonkeyKong · 架构', q: '生成器（Spawner）用 InvokeRepeating 而不是每帧判断计时，好处是？',
      o: ['更快', '意图更清晰，且 OnDisable 里 CancelInvoke 就能干净地停掉', '支持暂停', '省内存'], a: 1,
      e: '可读性也是设计目标。同时记得配对 CancelInvoke，否则切场景后还在生成。' },

    /* ---------- Asteroids / SpaceInvaders ---------- */
    { c: 'Asteroids · 物理', q: '小行星的飞船移动用 AddForce + 几乎没有阻力，是为了做出什么感觉？',
      o: ['省性能', '太空中没有摩擦的惯性漂移感', '防止穿模', '降低难度'], a: 1,
      e: '惯性和阻力的数值，就是「手感」的旋钮。想去太空感就几乎不加阻尼。' },
    { c: 'Asteroids · 生成', q: '小行星被击中会分裂成更小的两块，为什么必须限制最小尺寸？',
      o: ['为了好看', '否则会无限分裂，对象数量指数爆炸', 'Unity 限制', '提升难度'], a: 1,
      e: '递归/分裂生成一定要有终止条件，这是新手最容易踩的坑之一。' },
    { c: 'SpaceInvaders · 设计', q: '敌人方阵整体移动、碰边统一转向下压，这样设计的核心目的是？',
      o: ['节省性能', '制造整齐划一的压迫感，越往下降越快，紧张度递增', '方便编程', '随机性更强'],
      a: 1, e: '单个敌人各自 AI 反而会显得杂乱。「整体一致 + 逐渐逼近」是刻意的设计选择。' },
    { c: 'SpaceInvaders · 技术', q: '掩体做「纹素级像素破坏」，关键是哪一步？',
      o: ['换个贴图', '直接读写纹理的像素数据（GetPixel/SetPixel），并在改完后调用 Apply 提交',
             '用粒子特效', '加碰撞体'], a: 1,
      e: '忘了 Apply() 是这类需求的经典 bug —— 内存里改了，GPU 上没更新。' },

    /* ---------- Bomberman / Centipede / Minesweeper ---------- */
    { c: 'Bomberman · 协程', q: '炸弹延时引爆用协程 WaitForSeconds 而不是 Update 累加计时器，主要因为？',
      o: ['协程更快', '协程让「延时执行」的意图一目了然，还能天然被 Time.timeScale 影响（暂停时自动停）',
             'Update 不能计时', '省内存'], a: 1,
      e: '可读性 + 与暂停/时间缩放天然配合，这两个理由就足够。' },
    { c: 'Bomberman · 算法', q: '链式爆炸（火链引爆另一个炸弹）用什么实现最自然？',
      o: ['循环遍历', '递归：沿四方向逐格推进，遇到墙停止，遇到炸弹则递归引爆', '状态机', '事件队列'], a: 1,
      e: '递归一定要有「已引爆」标记做闸门，否则两个炸弹互相引爆会无限递归。' },
    { c: 'Centipede · 数据结构', q: '蜈蚣的多节段跟随，最贴合本质的数据结构是？',
      o: ['二维数组', '链表：每节记录前节走过的格子，断开即分裂', '栈', '哈希表'], a: 1,
      e: '打中中间一节就断成两条独立蜈蚣 —— 这正好是链表的天然操作。' },
    { c: 'Minesweeper · 算法', q: '点开空白格会连锁展开一大片，这个「连锁」的标准做法是？',
      o: ['递归', 'Flood Fill（BFS/DFS 队列展开），每个格子只入队一次', '排序', '动态规划'], a: 1,
      e: '关键是「访问标记」，少了它就会重复入队甚至死循环。' },

    /* ---------- 2048 / Tetris / Pacman ---------- */
    { c: '2048 · 算法', q: '2048 滑动合并时，为什么遍历顺序必须随方向改变？',
      o: ['没有区别', '否则一次移动里同一个方块会被合并两次（如 [2,2,4] 会错算成 8）', '为了性能', 'Unity 要求'], a: 1,
      e: '必须沿移动方向「从最前排开始」处理，并给已合并的格子打 locked 标记。' },
    { c: '2048 · 索引', q: '4×4 棋盘常用「一维数组 + index = y * 4 + x」，这样做的好处是？',
      o: ['省内存', '序列化、遍历、随机取空格都只需一层循环', '更精确', 'Unity 规定'], a: 1,
      e: '把二维问题降到一维，很多逻辑（比如「随机空位」）会大幅简化。' },
    { c: 'Tetris · 数学', q: '俄罗斯方块旋转为什么用矩阵/索引变换，而不是手写四组坐标？',
      o: ['手写更快', '矩阵形式统一处理所有方块，且便于加踢墙偏移', '节省内存', 'Unity 强制'], a: 1,
      e: '统一表达 + 可扩展，是避免「每个方块写一遍」的关键。' },
    { c: 'Tetris · 手感', q: '「踢墙（Wall Kick）」表解决的是什么问题？',
      o: ['方块下落太快', '贴墙或贴地形时旋转会被卡住，需要自动挪一格让它转得动',
             '消行判定', '加速下落'], a: 1,
      e: '没有踢墙，玩家会觉得「明明能转却转不了」，这是典型的挫败感来源。' },
    { c: 'Pacman · 架构', q: '幽灵的行为用「抽象基类 + 多个子类」而不是一个巨大的 switch，最大价值是？',
      o: ['运行更快', '加一种新行为 = 加一个新类，已有代码一行不动（对扩展开放、对修改关闭）',
             '省内存', '更容易调试'], a: 1,
      e: 'Pacman 有追逐/散射/惊吓/回家/眼睛五种行为，用 switch 会变成几百行的怪物。' },
    { c: 'Pacman · AI', q: '惊吓状态下幽灵改为「随机选方向」而不是继续追，设计意图是？',
      o: ['降低难度', '给玩家可预期的逃脱空间，让「反击」这件事成立',
             '节省计算', '看起来更自然'], a: 1,
      e: '如果惊吓了还精准追击，玩家根本逃不掉，能量豆就失去意义了。' }
  ];

  var KEY = 'ugames_bank_v1';
  var ans = {};
  try { ans = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { ans = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} }

  var list = document.getElementById('qList');
  var sel = document.getElementById('fChapter');

  /* 章节下拉 */
  var chapters = [];
  QS.forEach(function (q) { if (chapters.indexOf(q.c) < 0) chapters.push(q.c); });
  chapters.forEach(function (c) {
    var op = document.createElement('option');
    op.value = c; op.textContent = c;
    sel.appendChild(op);
  });

  function render() {
    var f = sel.value;
    var n = 0, r = 0;
    var h = '';
    QS.forEach(function (q, i) {
      if (f && q.c !== f) return;
      n++;
      var my = ans[i];
      if (my === q.a) r++;
      h += '<div class="q" data-i="' + i + '">' +
             '<h4>' + (i + 1) + '. <span class="ug-tag gray">' + q.c + '</span></h4>' +
             '<div class="stem">' + q.q + '</div>' +
             '<div class="opts">';
      q.o.forEach(function (o, j) {
        var cls = 'opt';
        if (my !== undefined) {
          if (j === q.a) cls += ' right';
          else if (j === my) cls += ' wrong';
        }
        h += '<button class="' + cls + '" data-j="' + j + '">' +
             String.fromCharCode(65 + j) + '. ' + o + '</button>';
      });
      h += '</div>';
      if (my !== undefined) h += '<div class="exp"><b>解析：</b>' + q.e + '</div>';
      h += '</div>';
    });
    list.innerHTML = h || '<div class="muted">没有匹配的题目。</div>';
    document.getElementById('qTotal').textContent = '共 ' + n + ' 题';
    document.getElementById('qRight').textContent = '已答对 ' + r + ' 题';
    document.getElementById('qRate').textContent = n ? ('正确率 ' + Math.round(r / n * 100) + '%') : '—';
    document.getElementById('qTip').textContent = '答案保存在本机浏览器，换设备不会同步。';

    Array.prototype.forEach.call(list.querySelectorAll('.q'), function (box) {
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function (b) {
        b.onclick = function () {
          var i = +box.getAttribute('data-i');
          ans[i] = +b.getAttribute('data-j');
          save();
          render();
        };
      });
    });
  }

  document.getElementById('bReset').onclick = function () {
    ans = {}; save(); render();
  };

  sel.onchange = render;
  render();
})();
</script>
</body>
</html>
