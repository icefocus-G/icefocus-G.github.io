<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070b18" />
<title>开发经验 · ICEFOCUS</title>
<link rel="icon" href="../../assets/icon.svg" />
<style>
  :root {
    --bg: #070b18;
    --ink: #e8eefb;
    --dim: #8b9ec2;
    --line: rgba(140, 170, 220, 0.16);
    --line-2: rgba(140, 170, 220, 0.3);
    --a1: #38bdf8;
    --a2: #a78bfa;
    --card: rgba(255, 255, 255, 0.028);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .mesh {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 45% at 12% 6%, rgba(56, 189, 248, 0.15), transparent 70%),
      radial-gradient(52% 42% at 88% 0%, rgba(167, 139, 250, 0.13), transparent 70%),
      radial-gradient(70% 50% at 50% 100%, rgba(56, 189, 248, 0.06), transparent 70%);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 15px clamp(18px, 4vw, 46px);
    background: rgba(7, 11, 24, 0.8);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 1px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.22em;
    color: var(--ink);
    text-decoration: none;
  }

  .brand em {
    font-style: normal;
    background: linear-gradient(100deg, var(--a1), var(--a2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header nav { display: flex; align-items: center; gap: 8px; }

  header nav a {
    font-size: 12.5px;
    color: var(--dim);
    text-decoration: none;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: 0.18s;
    white-space: nowrap;
  }

  header nav a:hover {
    color: var(--ink);
    background: rgba(56, 189, 248, 0.1);
    border-color: rgba(56, 189, 248, 0.28);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(36px, 6vw, 74px) clamp(18px, 4vw, 46px) 80px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .eyebrow i {
    width: 20px;
    height: 1px;
    background: linear-gradient(90deg, var(--a1), var(--a2));
  }

  h1 {
    margin: 16px 0 12px;
    font-size: clamp(32px, 5.6vw, 50px);
    line-height: 1.12;
    letter-spacing: -0.012em;
  }

  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--a1), var(--a2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lede {
    max-width: 640px;
    margin: 0;
    font-size: 13.5px;
    line-height: 1.95;
    color: var(--dim);
  }

  .lede code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 6px;
    color: #a5e3ff;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
  }

  .counter {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    color: var(--dim);
  }

  .counter b { color: var(--ink); font-weight: 600; }
  .counter .pips { display: inline-flex; gap: 3px; }
  .counter .pip { width: 5px; height: 5px; border-radius: 50%; background: rgba(140, 170, 220, 0.26); }
  .counter .pip.on { background: var(--a1); box-shadow: 0 0 6px var(--a1); }

  /* 筛选 */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 34px 0 22px;
  }

  .filters button {
    font: inherit;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    transition: 0.18s;
  }

  .filters button:hover { color: var(--ink); border-color: var(--line-2); }

  .filters button.on {
    color: #05121f;
    background: linear-gradient(135deg, var(--a1), var(--a2));
    border-color: transparent;
    font-weight: 600;
  }

  /* 精选大卡 */
  .feature {
    display: block;
    position: relative;
    margin-top: 20px;
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    background: var(--card);
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .feature:hover {
    transform: translateY(-3px);
    border-color: var(--line-2);
    box-shadow: 0 26px 60px -34px rgba(56, 189, 248, 0.7);
  }

  .feature .shot {
    position: relative;
    aspect-ratio: 21 / 8;
    background: #0a1020;
    overflow: hidden;
  }

  .feature .shot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease;
  }

  .feature:hover .shot img { transform: scale(1.03); }

  .feature .shot::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(7, 11, 24, 0) 30%, rgba(7, 11, 24, 0.72) 100%);
  }

  .feature .body { padding: 22px clamp(20px, 3vw, 34px) 26px; }

  .feature h2 {
    margin: 10px 0 10px;
    font-size: clamp(20px, 3vw, 28px);
    line-height: 1.34;
    letter-spacing: -0.01em;
  }

  .feature .sub {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--a1);
    letter-spacing: 0.02em;
  }

  .feature p.desc {
    margin: 0;
    max-width: 74ch;
    font-size: 13px;
    line-height: 1.9;
    color: var(--dim);
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-top: 18px;
    font-size: 12px;
    color: rgba(139, 158, 194, 0.85);
  }

  .row .sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(140, 170, 220, 0.4); }

  .row .go {
    margin-left: auto;
    color: var(--a1);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .tagline { display: inline-flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--a1);
    background: rgba(56, 189, 248, 0.11);
    border: 1px solid rgba(56, 189, 248, 0.28);
  }

  .tag.v { color: var(--a2); background: rgba(167, 139, 250, 0.1); border-color: rgba(167, 139, 250, 0.28); }

  /* 普通卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
    margin-top: 18px;
  }

  .card {
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
  }

  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--line-2);
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 18px 38px -26px rgba(56, 189, 248, 0.6);
  }

  .card .thumb {
    aspect-ratio: 16 / 9;
    background: #0a1020;
    overflow: hidden;
  }

  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card .body { padding: 16px 17px 18px; display: flex; flex-direction: column; flex: 1; }

  .card h3 {
    margin: 8px 0 7px;
    font-size: 14.5px;
    line-height: 1.5;
    font-weight: 600;
  }

  .card p { margin: 0; font-size: 12px; line-height: 1.75; color: var(--dim); }

  .card .meta {
    margin-top: auto;
    padding-top: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: rgba(139, 158, 194, 0.75);
  }

  .card .meta .go { margin-left: auto; color: var(--a1); opacity: 0; transform: translateX(-4px); transition: 0.22s; }
  a.card:hover .meta .go { opacity: 1; transform: translateX(0); }

  /* 预留空位 */
  .card.empty {
    border-style: dashed;
    background: transparent;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 196px;
    cursor: default;
  }

  .card.empty .plus {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px dashed rgba(140, 170, 220, 0.32);
    color: rgba(139, 158, 194, 0.6);
    font-size: 17px;
    line-height: 1;
    transition: 0.22s;
  }

  .card.empty:hover .plus { border-color: var(--line-2); color: var(--dim); }

  .card.empty .hint {
    margin-top: 10px;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: rgba(139, 158, 194, 0.5);
  }

  .card.empty .hint small { display: block; margin-top: 4px; letter-spacing: 0.02em; font-size: 10.5px; opacity: 0.7; }

  .sec-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 46px 0 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .sec-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  .note {
    margin: 18px 0 0;
    font-size: 12px;
    line-height: 1.9;
    color: rgba(139, 158, 194, 0.72);
  }

  .note code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    padding: 2px 7px;
    border-radius: 6px;
    color: #cfe0ff;
    background: rgba(11, 16, 32, 0.6);
    border: 1px solid rgba(140, 170, 220, 0.18);
  }

  .empty-state {
    margin-top: 20px;
    padding: 40px 20px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 16px;
    font-size: 13px;
    color: var(--dim);
  }

  footer {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px clamp(18px, 4vw, 46px) 46px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.9;
    color: rgba(139, 158, 194, 0.72);
  }

  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 620px) {
    .feature .shot { aspect-ratio: 16 / 9; }
    .feature .shot img { object-position: 18% center; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card .body { padding: 12px 12px 14px; }
    .card h3 { font-size: 13px; }
    .card p { font-size: 11px; }
    .card.empty { min-height: 150px; }
    .row .go { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="mesh"></div>

<header>
  <a class="brand" href="../../">IF<em>.</em></a>
  <nav>
    <a href="../">工具箱</a>
    <a href="../../links.html">导航</a>
  </nav>
</header>

<main>
  <div class="eyebrow"><i></i>DEV NOTES</div>
  <h1>开发<em>经验</em></h1>
  <p class="lede">
    做东西时真正管用的东西都放这儿：别人写透的复盘、自己踩过的坑、以及能直接照着走的流程。
    页面按文章积累，<code>notes.js</code> 里加一条就多一篇。
  </p>
  <div class="counter">
    <span class="pips" id="pips"></span>
    <b id="used">0</b> 篇已收录 · 预留 <b id="slots">0</b> 个位置
  </div>

  <div class="filters" id="filters"></div>

  <div id="featured"></div>

  <div class="sec-title" id="listTitle">全部文章</div>
  <div class="grid" id="grid"></div>

  <p class="note">
    新增一篇：把文章文件夹放进 <code>dev-notes/</code>，再到 <code>dev-notes/notes.js</code> 里复制一段改字段即可，
    空位会自动减少，无需改动本页代码。
  </p>
</main>

<footer>
  文章版权归各原作者所有，本站仅作个人学习整理与摘录，引用请注明出处。<br>
  © 2026 ICEFOCUS · 工具箱 → 开发经验
</footer>

<script src="notes.js"></script>
<script>
(function () {
  'use strict';

  var data = Array.isArray(window.DEV_NOTES) ? window.DEV_NOTES.slice() : [];
  var SLOTS = Math.max(0, parseInt(window.DEV_NOTES_SLOTS, 10) || 0);

  var filtersEl = document.getElementById('filters');
  var featuredEl = document.getElementById('featured');
  var gridEl = document.getElementById('grid');
  var listTitle = document.getElementById('listTitle');
  var usedEl = document.getElementById('used');
  var slotsEl = document.getElementById('slots');
  var pipsEl = document.getElementById('pips');

  var active = '全部';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function tagsOf(item) { return Array.isArray(item.tags) ? item.tags : []; }

  function statsLine(item) {
    var st = item.stats && typeof item.stats === 'object' ? item.stats : {};
    var out = [];
    Object.keys(st).forEach(function (k) { if (st[k] !== '' && st[k] != null) out.push(esc(st[k])); });
    return out;
  }

  function tagHtml(item) {
    var t = tagsOf(item);
    if (!t.length) return '';
    return t.map(function (x, i) {
      return '<span class="tag' + (i > 0 ? ' v' : '') + '">' + esc(x) + '</span>';
    }).join('');
  }

  function featureCard(item) {
    if (!item.href) return '';
    var st = statsLine(item);
    var meta = [];
    if (item.date) meta.push(esc(item.date));
    if (item.author) meta.push(esc(item.author));
    st.forEach(function (x) { meta.push(x); });

    return (
      '<a class="feature" href="' + esc(item.href) + '">' +
        '<div class="shot">' + (item.cover ? '<img src="' + esc(item.cover) + '" alt="" loading="lazy">' : '') + '</div>' +
        '<div class="body">' +
          '<span class="tagline">' + tagHtml(item) + '</span>' +
          '<h2>' + esc(item.title) + '</h2>' +
          (item.subtitle ? '<p class="sub">' + esc(item.subtitle) + '</p>' : '') +
          (item.desc ? '<p class="desc">' + esc(item.desc) + '</p>' : '') +
          '<div class="row">' +
            meta.join('<span class="sep"></span>') +
            '<span class="go">开始阅读 →</span>' +
          '</div>' +
        '</div>' +
      '</a>'
    );
  }

  function card(item) {
    if (!item.href) {
      return '<div class="card empty"><span class="plus">+</span><span class="hint">待添加<small>预留位置</small></span></div>';
    }
    var st = statsLine(item).slice(0, 2);
    return (
      '<a class="card" href="' + esc(item.href) + '">' +
        '<div class="thumb">' + (item.cover ? '<img src="' + esc(item.cover) + '" alt="" loading="lazy">' : '') + '</div>' +
        '<div class="body">' +
          '<span class="tagline">' + tagHtml(item) + '</span>' +
          '<h3>' + esc(item.title) + '</h3>' +
          (item.desc ? '<p>' + esc(item.desc) + '</p>' : '') +
          '<div class="meta">' +
            '<span>' + esc(item.date || '') + '</span>' +
            (st.length ? '<span>·</span><span>' + st.join(' · ') + '</span>' : '') +
            '<span class="go">阅读 →</span>' +
          '</div>' +
        '</div>' +
      '</a>'
    );
  }

  /* 顶部筛选条：按出现顺序汇总所有标签 */
  function buildFilters() {
    var all = ['全部'];
    data.forEach(function (it) {
      tagsOf(it).forEach(function (t) { if (all.indexOf(t) < 0) all.push(t); });
    });
    filtersEl.innerHTML = all.map(function (t) {
      return '<button type="button" data-tag="' + esc(t) + '"' + (t === active ? ' class="on"' : '') + '>' + esc(t) + '</button>';
    }).join('');
    filtersEl.style.display = all.length > 1 ? '' : 'none';
  }

  function render() {
    var list = data.filter(function (it) {
      return active === '全部' || tagsOf(it).indexOf(active) >= 0;
    });

    // 精选：只在「全部」且存在 featured 时展示
    var feat = null;
    if (active === '全部') {
      for (var i = 0; i < list.length; i += 1) {
        if (list[i].featured && list[i].href) { feat = list[i]; break; }
      }
    }
    featuredEl.innerHTML = feat ? featureCard(feat) : '';

    var rest = list.filter(function (it) { return it !== feat; });
    var html = rest.map(card).join('');

    // 空位只在「全部」下补齐，避免筛选时满地虚线
    if (active === '全部') {
      var filled = data.filter(function (it) { return !!it.href; }).length;
      var left = Math.max(0, SLOTS - filled);
      for (var j = 0; j < left; j += 1) html += card({});
    }

    gridEl.innerHTML = html || '<div class="empty-state">这个分类下还没有文章。</div>';
    listTitle.textContent = active === '全部'
      ? (rest.length ? '更多文章' : '预留位置 · 后续文章')
      : active;
  }

  function refreshCount() {
    var filled = data.filter(function (it) { return !!it.href; }).length;
    usedEl.textContent = String(filled);
    slotsEl.textContent = String(Math.max(0, SLOTS - filled));
    var total = Math.max(filled, filled + Math.max(0, SLOTS - filled));
    var pip = '';
    for (var i = 0; i < Math.min(total, 12); i += 1) pip += '<span class="pip' + (i < filled ? ' on' : '') + '"></span>';
    pipsEl.innerHTML = pip;
  }

  filtersEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tag]');
    if (!b) return;
    active = b.getAttribute('data-tag');
    Array.prototype.forEach.call(filtersEl.children, function (x) {
      x.classList.toggle('on', x === b);
    });
    render();
  });

  buildFilters();
  refreshCount();
  render();
})();
</script>
</body>
</html>
