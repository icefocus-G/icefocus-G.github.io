<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<title>不背文字 · 小学语文生字表</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wall" id="wall"></div>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button class="tb-btn" id="btnBack" aria-label="返回" hidden>‹</button>
    <div class="tb-title" id="tbTitle">不背文字</div>
    <button class="tb-btn" id="btnSet" aria-label="设置">设</button>
  </header>

  <main class="stage" id="stage">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-learn" hidden></section>
    <section class="view" id="v-test" hidden></section>
    <section class="view" id="v-books" hidden></section>
    <section class="view" id="v-me" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-go="home" class="on"><b>学</b><span>今日</span></button>
    <button data-go="books"><b>书</b><span>字书</span></button>
    <button data-go="me"><b>我</b><span>我的</span></button>
  </nav>
</div>

<div class="sheet-mask" id="mask" hidden></div>
<aside class="sheet" id="sheet" hidden></aside>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="data/chars.js"></script>
<script src="data/books.js"></script>
<script src="data/zi-1.js"></script>
<script src="data/zi-2.js"></script>
<script src="data/zi-3.js"></script>
<script src="data/zi-4.js"></script>
<script src="data/zi-5.js"></script>
<script src="data/zi-6.js"></script>
<script src="js/app.js"></script>
</body>
</html>
